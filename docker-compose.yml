version: '3.8'

services:
  python_app:
    build:
      context: ./python_app
    ports:
      - "5000:5000"
    depends_on:
      - mysql
      - redis
    volumes:
      - ./python_app:/app

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: shop
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data

